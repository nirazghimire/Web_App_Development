upstream slicerwebapp {
    server web:8000;
}

server {
    listen 80;
    server_name localhost;
    
    # Uncomment the following line to redirect HTTP to HTTPS once certificates are added
    # return 301 https://$host$request_uri;

    client_max_body_size 100M;

    location / {
        proxy_pass http://slicerwebapp;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location /static/ {
        alias /app/staticfiles/;
    }

    # Protected media handled by Django X-Accel-Redirect
    location /protected_media/ {
        internal;
        alias /app/media/;
    }
}

