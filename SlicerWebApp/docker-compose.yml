version: '3.8'

services:
  web:
    build: .
    command: gunicorn SlicerWebApp.wsgi:application --bind 0.0.0.0:8000 --workers 3
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    expose:
      - 8000
    env_file:
      - .env.prod
    depends_on:
      - db

  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    env_file:
      - .env.prod

  nginx:
    image: nginx:1.25-alpine
    restart: always
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      # Uncomment the next line when you have SSL certificates in the nginx/ssl/ folder
      # - ./nginx/ssl:/etc/nginx/ssl
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - 80:80
      # Uncomment the next line to enable HTTPS port
      # - 443:443
    depends_on:
      - web

volumes:
  postgres_data:
  static_volume:
  media_volume:
